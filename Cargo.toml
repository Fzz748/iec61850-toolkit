[package]
name = "iec61850-toolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Offline IEC 61850 SCL engineering CLI"
license = "Apache-2.0"
publish = false

[lib]
name = "iec61850_toolkit"
path = "src/lib.rs"

[[bin]]
name = "iec61850"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.42"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[[test]]
name = "cli"
path = "tests/cli/main.rs"
